[project]
name = "mantis-pi05-folding-environment"
version = "0.1.0"
description = "Locked runtime and training environment for Mantis PI05 folding"
requires-python = "==3.10.*"
dependencies = [
    "lerobot",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.53.2",
    "scipy==1.14.1",
    "websockets==15.0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
lerobot = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
